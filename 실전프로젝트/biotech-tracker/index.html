<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바이오 이벤트 트래커</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo">🧬</span>
      <h1>Bio Tracker</h1>
      <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="닫기">✕</button>
    </div>

    <div class="sidebar-stats">
      <div class="stat-item">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">전체</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="stat-upcoming">0</span>
        <span class="stat-label">예정</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="stat-thismonth">0</span>
        <span class="stat-label">이번 달</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-icon">📊</span>대시보드
      </button>
      <button class="nav-item" data-view="calendar">
        <span class="nav-icon">📅</span>캘린더
      </button>
      <button class="nav-item" data-view="list">
        <span class="nav-icon">📋</span>이벤트 목록
      </button>
      <button class="nav-item" data-view="stocks">
        <span class="nav-icon">💊</span>종목 현황
      </button>
    </nav>

    <div class="sidebar-section">
      <h3>🤖 AI 이벤트 검색</h3>
      <div class="ai-search-form">
        <input type="text" id="ai-stock-input" placeholder="종목명 (예: 셀트리온, Moderna)" />
        <select id="ai-market-select">
          <option value="">시장 선택</option>
          <option value="KOSDAQ">KOSDAQ</option>
          <option value="KOSPI">KOSPI</option>
          <option value="NASDAQ">NASDAQ</option>
          <option value="NYSE">NYSE</option>
        </select>
        <button class="btn btn-ai" id="ai-search-btn">
          <span>🤖</span> AI 이벤트 검색
        </button>
      </div>
      <div id="ai-result" class="ai-result hidden"></div>
    </div>

    <div class="sidebar-footer">
      <button class="btn btn-ghost w-full" id="settings-btn">⚙️ API 키 설정</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="메뉴">☰</button>
        <h2 id="page-title">대시보드</h2>
      </div>
      <div class="topbar-right">
        <div class="filter-chips" id="market-chips">
          <span class="filter-label">시장</span>
          <button class="chip active" data-market="all">전체</button>
          <button class="chip" data-market="KOSDAQ">KOSDAQ</button>
          <button class="chip" data-market="KOSPI">KOSPI</button>
          <button class="chip" data-market="NASDAQ">NASDAQ</button>
          <button class="chip" data-market="NYSE">NYSE</button>
        </div>
        <button class="btn btn-primary" id="add-event-btn">+ 이벤트 추가</button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- Add/Edit Event Modal -->
<div class="modal-overlay hidden" id="event-modal-overlay">
  <div class="modal" id="event-modal">
    <div class="modal-header">
      <h3 id="modal-title">이벤트 추가</h3>
      <button class="icon-btn modal-close" id="event-modal-close">✕</button>
    </div>
    <form id="event-form" class="modal-body" novalidate>
      <input type="hidden" name="id" />
      <div class="form-row">
        <div class="form-group">
          <label>종목명 <span class="req">*</span></label>
          <input type="text" name="stockName" placeholder="예: 셀트리온" />
        </div>
        <div class="form-group">
          <label>종목코드</label>
          <input type="text" name="stockCode" placeholder="예: 068270" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>시장 <span class="req">*</span></label>
          <select name="market">
            <option value="">선택</option>
            <option value="KOSDAQ">KOSDAQ</option>
            <option value="KOSPI">KOSPI</option>
            <option value="NASDAQ">NASDAQ</option>
            <option value="NYSE">NYSE</option>
          </select>
        </div>
        <div class="form-group">
          <label>이벤트 유형 <span class="req">*</span></label>
          <select name="eventType">
            <option value="">선택</option>
            <option value="clinical_result">🧪 임상시험 결과</option>
            <option value="fda_approval">✅ FDA/식약처 승인</option>
            <option value="pdufa">📋 PDUFA 날짜</option>
            <option value="earnings">💰 실적 발표</option>
            <option value="conference">🎤 학회 발표</option>
            <option value="regulatory_filing">📄 IND/NDA 제출</option>
            <option value="licensing">🤝 기술이전 계약</option>
            <option value="other">📌 기타</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>임상 단계</label>
          <select name="phase">
            <option value="">해당없음</option>
            <option value="Phase 1">Phase 1</option>
            <option value="Phase 1/2">Phase 1/2</option>
            <option value="Phase 2">Phase 2</option>
            <option value="Phase 2/3">Phase 2/3</option>
            <option value="Phase 3">Phase 3</option>
            <option value="BLA/NDA">BLA/NDA</option>
          </select>
        </div>
        <div class="form-group">
          <label>이벤트 날짜 <span class="req">*</span></label>
          <input type="date" name="eventDate" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>기대감 지수</label>
          <div class="range-wrapper">
            <input type="range" name="expectation" id="exp-range" min="1" max="5" value="3" />
            <span id="exp-display">3 — 보통</span>
          </div>
        </div>
        <div class="form-group">
          <label>상태</label>
          <select name="status">
            <option value="upcoming">예정</option>
            <option value="pending">진행 중</option>
            <option value="completed">완료 (긍정)</option>
            <option value="failed">완료 (부정)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>메모</label>
        <textarea name="memo" rows="3" placeholder="분석 내용, 추가 정보..."></textarea>
      </div>
    </form>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="event-cancel">취소</button>
      <button class="btn btn-primary" id="event-save">저장</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay hidden" id="detail-modal-overlay">
  <div class="modal" id="detail-modal">
    <div class="modal-header">
      <h3 id="detail-title">이벤트 상세</h3>
      <button class="icon-btn modal-close" id="detail-modal-close">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer">
      <button class="btn btn-danger-ghost" id="detail-delete">삭제</button>
      <span style="flex:1"></span>
      <button class="btn btn-ghost" id="detail-close-btn">닫기</button>
      <button class="btn btn-primary" id="detail-edit">수정</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay hidden" id="settings-modal-overlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3>⚙️ API 키 설정</h3>
      <button class="icon-btn modal-close" id="settings-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Anthropic API 키</label>
        <input type="password" id="api-key-input" placeholder="sk-ant-..." />
        <p class="form-hint">AI 이벤트 자동 검색에 필요합니다. 키는 브라우저 로컬 스토리지에만 저장됩니다.</p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="settings-cancel">취소</button>
      <button class="btn btn-primary" id="settings-save">저장</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
